# Signed release APK on GitHub Releases, built when a version tag is pushed:
#   git tag v1.0.1 && git push origin v1.0.1
# Needs the repository secrets listed in README → Releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Tag matches pubspec version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag doesn't match pubspec version $version"
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing (README → Releases)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/release.jks"
          } > android/key.properties

      - run: flutter build apk --release

      - name: GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="forgelink-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "Forgelink ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
