name: forgelink
description: "Syncs Health Connect and Kalorické tabulky data into the coach's Google Sheet."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  meta: ^1.17.0

  # --- Health Connect (weight, steps) ---
  health: ^13.3.1

  # --- Google account + Sheets API v4 ---
  google_sign_in: ^7.2.0
  # Token requests for the pinned account email (docs/implementation_plan.md §4 step 3).
  google_sign_in_platform_interface: ^3.1.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.0

  # --- Kalorické tabulky REST client ---
  http: ^1.6.0
  crypto: ^3.0.7

  # --- Storage ---
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5

  # --- Brand logos in Settings (Google, Sheets) ---
  flutter_svg: ^2.0.17

  # --- State / DI ---
  provider: ^6.1.5

  # --- Phase 6: background sync + failure notifications ---
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo_fg_384.png
    - assets/icons/
  # Manrope (SIL OFL, assets/fonts/OFL.txt): static instances of the
  # google/fonts variable font, one file per weight the design uses.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
