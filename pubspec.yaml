name: forgelink
description: "Syncs Health Connect and Kalorické tabulky data into the coach's Google Sheet."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  meta: ^1.17.0

  # --- Health Connect (weight, steps) ---
  health: ^13.3.1

  # --- Google account + Sheets API v4 ---
  google_sign_in: ^7.2.0
  # Token requests for the pinned account email (docs/implementation_plan.md §4 step 3).
  google_sign_in_platform_interface: ^3.1.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.0

  # --- Kalorické tabulky REST client ---
  http: ^1.6.0
  crypto: ^3.0.7

  # --- Storage ---
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5

  # --- State / DI ---
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
